name: Europa Anew checks
on:
  push:
    paths: ['.github/workflows/checks.yml']
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: europa-offline-checks
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 7vvkn7h774-blip/europa-anew
          token: ${{ secrets.STATE_GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and verify dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt > "$RUNNER_TEMP/europa-dependencies.log" 2>&1 || { echo "::error::Dependency installation failed."; exit 1; }
          python -m pip check >> "$RUNNER_TEMP/europa-dependencies.log" 2>&1 || { echo "::error::Dependency verification failed."; exit 1; }
      - name: Run offline tests and rendering
        env:
          EUROPA_MODE: dry-run
          EUROPA_ENABLE_PUBLISH: 'false'
        shell: bash
        run: |
          python tools/test_offline.py > "$RUNNER_TEMP/europa-tests.log" 2>&1 || { echo "::error::Offline tests failed. Reproduce against the private source revision."; exit 1; }
          python -m europa demo > "$RUNNER_TEMP/europa-demo.log" 2>&1 || { echo "::error::Offline rendering failed."; exit 1; }
          echo "Offline tests and rendering passed."
      # Private source, reports, test names and generated media are never uploaded.
